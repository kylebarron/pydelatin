[project]
name = "pydelatin"
version = "0.3.0"
description = "A Python wrapper of hmm for fast terrain mesh generation"
readme = "README.md"
authors = [{ name = "Kyle Barron", email = "kylebarron2@gmail.com" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
keywords = ["terrain", "mesh", "delatin", "elevation", "gis", "3d"]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/kylebarron/pydelatin"
Repository = "https://github.com/kylebarron/pydelatin"
Issues = "https://github.com/kylebarron/pydelatin/issues"
Changelog = "https://github.com/kylebarron/pydelatin/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["imageio>=2.9", "pytest>=8"]

[build-system]
# pybind11's numpy support is resolved at runtime, so numpy isn't needed to
# build. pybind11 2.13 is the minimum for `py::mod_gil_not_used()`.
requires = ["pybind11>=2.13", "setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pydelatin", "pydelatin.*"]

[tool.cibuildwheel]
skip = "cp38*"
