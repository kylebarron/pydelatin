name: Test Python

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-python:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      # Ensure docs build without warnings. Docs are generated from source,
      # so this doesn't need to compile the extension.
      - name: Check docs
        run: uv run --only-group docs mkdocs build --strict

      # Use ruff-action so we get annotations in the Github UI
      - uses: astral-sh/ruff-action@v4.1.0

      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install glm
        run: sudo apt-get update && sudo apt-get install -y libglm-dev

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run pytest
